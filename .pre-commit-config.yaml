repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # The frozen byte-identity fixtures hold raw tool output (an empty
        # pandas CSV is a lone newline byte); the fixer would rewrite the
        # very bytes the tests compare against.
        exclude: '^experiments/03_multistate_gdn2/01_synthetic_pilot/fixtures/'
    -   id: trailing-whitespace
        exclude: '^experiments/03_multistate_gdn2/01_synthetic_pilot/fixtures/'
-   repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
    -   id: black
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
    -   id: ruff
        args: ["--fix", "--show-files"]
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock
