[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research_monorepo"
version = "0.1.0"
authors = [{ name = "Loo Jun Zing", email = "jzloo11111@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # Core DL
    # 2.11 is the first PyPI Linux wheel built against CUDA 13 (no custom index).
    "torch>=2.11",

    # Pytorch native external dependencies
    "rotary-embedding-torch",

    # Efficient implementation of Mechanisms
    "flash-linear-attention",
    "flash_attn_res",

    # Hugging Face Ecosystem
    "huggingface_hub",
    "transformers",
    "diffusers",
    "timm",
    "accelerate",
    "tokenizers",
    "datasets",
    "peft",
    "evaluate",
    "trl",
    "gradio",

    # Pytorch lightning (trainer) and ecosystem
    # 2.4 is the first release where Ctrl-C exits the process instead of returning
    # normally from Trainer.fit() (Lightning changelog 2.4.0, PR #19976).
    "lightning>=2.4",
    "rich", # required for RichProgressBar

    # Model Optimization
    "bitsandbytes",
    "einops",
    "triton",

    # Infrastructure & Config
    "wandb",
    "omegaconf",
    "hydra-core",

    # Utilities
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "pytest",
    "python-dotenv"
]

[dependency-groups]
dev = ["pre-commit", "black", "isort", "ruff"]

[tool.uv]
# The pilot runs only on Linux x86_64 (WSL, rented GPUs, the x86 cluster nodes).
# Restricting the resolution avoids failures from packages without macOS or
# Windows wheels (triton, bitsandbytes) and keeps the lock small.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
markers = ["slow: long-running correctness tests (deselect with -m 'not slow')"]

[tool.isort]
profile = "black"
line_length = 88

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
