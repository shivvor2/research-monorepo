# =============================================================================
# NanoGPT Baseline Training Config
# =============================================================================
# Usage:
#   python 02_pretrain.py                           # Use defaults
#   python 02_pretrain.py training.max_steps=1000   # Override
#   python 02_pretrain.py --config-name=test        # Use test config
# =============================================================================

# Set to an integer for reproducibility, or null for random seed
seed: null

# -----------------------------------------------------------------------------
# Experiment Identity & Checkpointing
# -----------------------------------------------------------------------------
experiment:
  # Logical name for this experiment family.
  # Used to track the "latest" run for auto-resume.
  name: nanogpt_base

checkpoint:
  # Where to write checkpoints *inside* the Hydra run directory
  dir: checkpoints

  # Resume behavior: 'auto', null, or explicit path
  # - auto: Find latest run for this experiment.name and resume if compatible.
  # - null: Always start fresh.
  # - /path/to/ckpt: Resume explicitly from this path.
  resume_from: auto


# -----------------------------------------------------------------------------
# Model Architecture (GPT-2 Small, 124M params)
# -----------------------------------------------------------------------------
model:
  vocab_size: 50304      # Padded for alignment (50257 actual)
  block_size: 1024
  n_layer: 12
  n_embd: 768
  n_head: 12
  ff_dim: 2048
  bias: false
  dropout: 0.0
  padding_idx: 50256

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  seq_len: 1024
  batch_size: 4          # Physical batch (limited by 12GB VRAM)
  num_workers: 4

# -----------------------------------------------------------------------------
# Training Loop
# -----------------------------------------------------------------------------
training:
  # Steps calculated for full FineWeb-10B:
  # 10B tokens / (4 * 1024 * 16) ≈ 150,000 steps
  max_steps: 150000
  grad_accum: 16        # Effective batch = 4 * 16 * 1024 = 65,536 tokens
  grad_clip_val: 1.0
  precision: bf16-mixed

  val_check_interval: 1000
  limit_val_batches: 100
  log_every_n_steps: 10

  # Checkpoint frequency (writing to checkpoint.dir)
  checkpoint_every_n_steps: 1000
  save_top_k: 3

  # Number of training shards for fineweb dataset
  num_train_shards: 99 # All (99) shards

  # Limit validation steps


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  # WandB (set project_name to null to disable)
  wandb:
    enabled: true
    project: nanogpt-baseline
    name: null           # Auto-generated if null

  # CSV logger (always enabled for local analysis)
  csv:
    enabled: true
    save_dir: logs/csv

# -----------------------------------------------------------------------------
# Matrix Optimizer (NorMuon) - for attention/MLP weights
# -----------------------------------------------------------------------------
optimizer:
  matrix:
    class_path: research_lib.optimizers.NorMuon
    lr: 0.02
    weight_decay: 0.1
    momentum: 0.95
    beta2: 0.95

    schedule:
      lr:
        warmup_frac: 0.01
        cooldown_frac: 0.20
        min_value: 0.0
        max_value: ${optimizer.matrix.lr}
        decay_type: cosine
      momentum:
        warmup_frac: 0.01
        cooldown_frac: 0.20
        min_value: 0.85
        max_value: ${optimizer.matrix.momentum}
        decay_type: linear

# -----------------------------------------------------------------------------
# Vector Optimizer (CautiousAdamW) - for embeddings/norms
# -----------------------------------------------------------------------------
  vector:
    class_path: research_lib.optimizers.CautiousAdamW
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1

    schedule:
      lr:
        warmup_frac: 0.01
        cooldown_frac: 0.20
        min_value: 0.0
        max_value: ${optimizer.vector.lr}
        decay_type: cosine

# -----------------------------------------------------------------------------
# Hydra Settings
# -----------------------------------------------------------------------------
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true
