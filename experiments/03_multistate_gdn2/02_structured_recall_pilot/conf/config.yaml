# =============================================================================
# Structured-Recall Pilot Config
# =============================================================================
# Usage:
#   python 01_train.py                                # defaults (mqar)
#   python 01_train.py task=mqar model.mixer=attention
#   python 01_train.py --config-name=test task=mqar   # tiny CPU smoke
# =============================================================================

seed: 0

experiment:
  name: multistate_gdn2_structured_recall_pilot
  phase: 1                 # 1 = calibration; >= 2 needs frozen_protocol.frozen
  tier: null               # set by sweep configs, recorded in the run JSON

defaults:
  - task: mqar
  - harness: zoology
  - _self_

model:                     # -> ZoologyLMConfig (harness-specific extras below)
  vocab_size: 8192
  d_model: 32
  n_layer: 2
  layer_pattern: zoology   # layer 0 BaseConv, layer 1 the mixer under test
  state_mixer: none
  num_heads: 2
  head_dim: null           # null -> d_model // num_heads
  expand_v: 1.0
  ff_mult: 4               # feed-forward hidden-dim multiplier
  base_conv_kernel: 3      # the Zoology layer-0 short-conv kernel size
  gate_mode: full
  layout: single
  lambda_mode: mlp
  window: 8
  chunk_size: 16
  t_max: ${task.max_seq_len}
  output_gate_activation: silu
  mixer_mode: chunk
  mixer: gated_delta       # gated_delta | attention (the mixer choice)

optimizer:
  lr: null   # null -> frozen_protocol.yaml (task, layout, gate_mode)
  weight_decay: 0.1
  betas: [0.9, 0.95]
  decay_scheme: grouped

training:
  batch_size: 256
  collect_mixer_stats: true  # per-layer lambda/erase stats in validation
  max_steps: 20000
  val_check_interval: 500
  early_stop_threshold: 0.99
  precision: 32-true
  grad_clip_val: null
  loss_on: answers
  answer_head: true
  compile: false
  log_every_n_steps: 50

data:
  num_workers: 2
  num_val_per_slice: 1000
  num_test_per_slice: 1000

launch:
  skip_completed: true
  stop_file: STOP
  shard_index: 0
  num_shards: 1

output:
  runs_dir: ${hydra:runtime.cwd}/runs/${task.name}
  save_final_checkpoint: false

logging:
  csv:
    enabled: true
    save_dir: ${output.runs_dir}/curves
  wandb:
    enabled: false
    project: MultistateGDN2
    entity: null
    upload_record: true
    upload_checkpoint: false

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: "${hydra:job.num}"
  job:
    chdir: true