# @package _global_
# Entity-field calibration, single-state: gate {kda, full} x LR
# {1e-3, 3e-3, 1e-2} x selection seeds {100, 101}, 12 short runs.
# Per gate, pick the LR with the best validation accuracy on seeds
# 100-101; the gap column reads the screening cell at the selected
# point. Runs before calib_ef_multi (the multi-state go reading).
# Run: python 01_train.py +sweep=calib_ef_single --multirun

experiment:
  phase: 1
  tier: calib_ef_single

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: entity_field
      model.gate_mode: kda,full
      model.layout: single
      optimizer.lr: 0.001,0.003,0.01
      seed: range(100,102)
