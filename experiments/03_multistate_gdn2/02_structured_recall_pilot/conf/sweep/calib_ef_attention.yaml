# @package _global_
# Entity-field attention control: LR {1e-3, 3e-3, 1e-2} x selection
# seeds {100, 101}, 6 short runs. The positive control for entity-field
# is the causal self-attention mixer of the Zoology harness; pick the LR
# with the best validation accuracy on seeds 100-101, and phase 2 reads
# it from lr_table.entity_field.attention in the frozen protocol. The
# layout stays at the harness default (single): the frozen snippet
# refuses more than one attention layout per task.
# Run: python 01_train.py +sweep=calib_ef_attention --multirun

experiment:
  phase: 1
  tier: calib_ef_attention

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: entity_field
      model.mixer: attention
      optimizer.lr: 0.001,0.003,0.01
      seed: range(100,102)
