# =============================================================================
# Frozen protocol: filled at the end of calibration, then committed.
# =============================================================================
# While ``frozen: false``, the smoke and debug configs run; an experiment
# phase >= 2 refuses to run. Calibration fills the LR and weight-decay
# tables and the harness choices for each harness, then sets ``frozen: true``.

frozen: false

# The frozen architecture choices per harness. The keys a harness may
# hold are the protocol's ``FROZEN_HARNESS_KEYS`` (the single source of
# truth) - Zoology's d_model / layer_pattern / state_mixer, MAD's d_model /
# num_mixers - and ``check_frozen_choices`` requires a frozen entry to list
# exactly those, comparing each set key against the run.
harness_choices:
  zoology: {d_model: null, layer_pattern: null, state_mixer: null}
  mad: {d_model: null, num_mixers: null}

# The frozen per-task settings. The keys a task may freeze are the
# protocol's ``FROZEN_TASK_KEYS``; a task with no entry there (its
# difficulty comes from its slices, not its length) has nothing to freeze.
task_settings:
  mad_fuzzy: {seq_len: null}

# The frozen peak LR per (task, mixer, layout, gate).
#
#   lr_table:
#     <task>:
#       gated_delta:
#         <layout>:
#           <gate>: <lr>
#       attention: <lr>          # the attention run has no gate/layout
#
# A missing or null node anywhere in a key's path falls through to the
# "fill conf/frozen_protocol.yaml" error.
lr_table: {}

# The frozen weight decay, with the same key path as ``lr_table``
# (``<task>.gated_delta.<layout>.<gate>``, ``<task>.attention``).
weight_decay_table: {}
