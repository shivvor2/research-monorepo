# =============================================================================
# Tiny CPU smoke config
# =============================================================================
# Usage:
#   python 01_train.py --config-name=test task=mqar
# Finishes in a few minutes on CPU and writes a run JSON under runs/<task>/.

defaults:
  - config

experiment:
  name: multistate_gdn2_structured_recall_pilot_test
  phase: 1
  tier: smoke

task:
  vocab_size: 16
  seq_len: 32
  max_seq_len: 48
  num_kv_pairs: [2, 4]        # mqar only
  num_train: 64               # mad_fuzzy only
  num_val: 32
  num_test: 32

model:
  d_model: 16
  num_heads: 1
  window: 4
  gate_mode: full
  layout: ws

data:
  num_workers: 0
  num_val_per_slice: 16
  num_test_per_slice: 16

training:
  batch_size: 64
  epochs: 2                   # mad_fuzzy: the run length derives from this
  max_steps: 20
  val_check_interval: 10
  log_every_n_steps: 1

optimizer:
  lr: 0.003   # not frozen yet; the smoke config sets its own
  weight_decay: 0.0   # same: the harness leaves it for the frozen protocol

logging:
  csv:
    enabled: true
    save_dir: logs/test_csv
  wandb:
    enabled: false

hydra:
  run:
    dir: outputs/test/${now:%Y-%m-%d}/${now:%H-%M-%S}
