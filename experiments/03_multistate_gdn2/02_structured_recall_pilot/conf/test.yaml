# =============================================================================
# Tiny CPU smoke config
# =============================================================================
# Usage:
#   python 01_train.py --config-name=test task=mqar
#   python 01_train.py --config-name=test task=entity_field
#   python 01_train.py --config-name=test task=mad_fuzzy
# Finishes in a few minutes on CPU and writes a run JSON under runs/<task>/.
#
# The task's own smoke sizes (vocab / seq_len / field counts) live in
# ``conf/smoke/<task>.yaml``, selected here through the ``smoke`` group
# keyed on the task choice; a new task adds ``conf/smoke/<task>.yaml`` and
# nothing else. Model, training and data smoke settings stay here, shared.

defaults:
  - config
  - optional smoke: ${task}

experiment:
  name: multistate_gdn2_structured_recall_pilot_test
  phase: 1
  tier: smoke

model:
  d_model: 16
  num_heads: 1
  attention_num_heads: 4   # d=16 -> 4 heads of width 4 (even rotary dim)
  window: 4
  gate_mode: full
  layout: ws

data:
  num_workers: 0
  num_val_per_slice: 16
  num_test_per_slice: 16

training:
  batch_size: 64
  epochs: 2                   # mad_fuzzy: the run length derives from this
  max_steps: 20
  val_check_interval: 10
  log_every_n_steps: 1

optimizer:
  lr: 0.003   # not frozen yet; the smoke config sets its own
  weight_decay: 0.0   # same: the harness leaves it to the frozen protocol

logging:
  csv:
    enabled: true
    save_dir: logs/test_csv
  wandb:
    enabled: false

hydra:
  run:
    dir: outputs/test/${now:%Y-%m-%d}/${now:%H-%M-%S}
