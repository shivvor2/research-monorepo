# =============================================================================
# Tiny CPU smoke config
# =============================================================================
# Usage:
#   python 01_train.py --config-name=test task=mqar
# Finishes in a few minutes on CPU and writes a run JSON under runs/<task>/.

defaults:
  - config

experiment:
  name: multistate_gdn2_structured_recall_pilot_test
  phase: 1
  tier: smoke

# Task overrides: each task's builder keeps only its own config fields,
# so the smoke can run any registered task (mqar ignores the
# entity-field keys and vice versa). The entity-field numbers keep every
# slice feasible at seq_len=64 (N + U <= slots, >= distant_min_blocks + 1
# blocks, enough entity ids and values).
task:
  vocab_size: 128
  seq_len: 64
  max_seq_len: 64
  num_kv_pairs: [2, 4]
  num_fields: 2
  num_entities: [2, 4]
  update_fraction: 0.75
  block_size: 8
  distant_min_blocks: 2
  reserved_filler: 2

model:
  d_model: 16
  num_heads: 1
  window: 4
  gate_mode: full
  layout: ws

data:
  num_workers: 0
  num_val_per_slice: 16
  num_test_per_slice: 16

training:
  batch_size: 64
  max_steps: 20
  val_check_interval: 10
  log_every_n_steps: 1

optimizer:
  lr: 0.003   # not frozen yet; the smoke config sets its own

logging:
  csv:
    enabled: true
    save_dir: logs/test_csv
  wandb:
    enabled: false

hydra:
  run:
    dir: outputs/test/${now:%Y-%m-%d}/${now:%H-%M-%S}
