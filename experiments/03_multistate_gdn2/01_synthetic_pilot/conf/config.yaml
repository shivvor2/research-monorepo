# =============================================================================
# Multi-State GDN-2 Synthetic Pilot Config
# =============================================================================
# Usage:
#   python 01_train.py                                # defaults (mqar)
#   python 01_train.py task=overwrite                # overwrite task
#   python 01_train.py +sweep=tier1_core             # one tier grid
#   python 01_train.py --config-name=test            # tiny CPU smoke config
#   python 01_train.py --config-name=debug            # one step, every layout
# =============================================================================

seed: 0

experiment:
  name: multistate_gdn2_synthetic_pilot
  phase: 1                 # 1 = calibration; >= 2 needs frozen_protocol.frozen
  tier: null               # set by sweep configs, recorded in the run JSON

defaults:
  - task: mqar
  - _self_

model:                     # -> ZoologyLMConfig
  vocab_size: 8192
  d_model: 32
  n_layer: 2
  layer_pattern: zoology   # layer 0 BaseConv, layer 1 the layer under test
  state_mixer: none
  num_heads: 2
  head_dim: null           # null -> d_model // num_heads
  expand_v: 1.0            # value-dim multiplier (tier 5 sets 10)
  ff_mult: 4               # feed-forward hidden-dim multiplier
  base_conv_kernel: 3      # the Zoology layer-0 short-conv kernel size
  gate_mode: full
  layout: single
  lambda_mode: mlp
  window: 8
  chunk_size: 16
  t_max: ${task.max_seq_len}   # ll slot count = bitlen(t_max) + 1
  output_gate_activation: silu
  mixer_mode: chunk

optimizer:
  lr: null   # null -> frozen_protocol.yaml (task, layout, gate_mode)
  weight_decay: 0.1
  betas: [0.9, 0.95]
  decay_scheme: grouped   # grouped | uniform (uniform = decay everywhere)

training:
  batch_size: 256
  collect_mixer_stats: true  # per-layer lambda/erase stats in validation
  max_steps: 20000
  val_check_interval: 500
  early_stop_threshold: 0.99
  precision: 32-true
  grad_clip_val: null
  loss_on: answers         # answers | all (full-sequence CE)
  answer_head: true        # under loss_on: answers, evaluate the LM head only
                           # at answer positions (exact: same loss,
                           # gradients and metrics in exact arithmetic;
                           # see the README). false restores the full head
                           # (checks only; it changes the run identity).
  compile: false           # with answer_head: true, the answer-head path
                           # runs the model uncompiled (torch.compile
                           # compiles only forward); use answer_head: false
                           # for compiled runs
  log_every_n_steps: 50

data:
  num_workers: 2
  num_val_per_slice: 1000
  num_test_per_slice: 1000

launch:
  # Protocol tiers only: skip a run whose record is test_done with the
  # same identity (the smoke and debug configs always run).
  skip_completed: true
  # In the launch directory; while it exists, no new run starts.
  stop_file: STOP
  # Several processes on one machine split one sweep: job k runs only in
  # the process with shard_index == k % num_shards.
  shard_index: 0
  num_shards: 1

output:
  runs_dir: ${hydra:runtime.cwd}/runs/${task.name}
  # Final checkpoints are OFF by default: final weights are saved
  # only for runs whose weights are needed, e.g. the mechanism probes; a
  # re-run in the same environment is close but not bit-identical. When
  # on, the checkpoint is saved atomically after fit and before the test
  # pass (runs/<task>/<run_id>.pt, git-ignored).
  save_final_checkpoint: false

logging:
  csv:
    enabled: true
    save_dir: ${output.runs_dir}/curves   # curves next to the run records
  wandb:
    # Rented machines: each completed run uploads its record, curve and
    # optionally its checkpoint as a run_record artifact, and 03_pull.py
    # copies them back into the local runs/ store. Logging is excluded
    # from the run identity, so turning W&B on never changes a run.
    enabled: false
    project: MultistateGDN2
    entity: null
    upload_record: true        # run JSON + curve as an artifact, done runs only
    upload_checkpoint: false   # also the final checkpoint, if one was saved

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: "${hydra:job.num}"
  job:
    chdir: true
