# @package _global_
# Long-T tier (Phase 4): core 6 configs x seeds 0-9 on the long, sparse
# MQAR variant (T = 2048, D in {8,16,32,64}, uniform query gaps). 60
# runs, one run per GPU (separate processes with CUDA_VISIBLE_DEVICES,
# not DDP). Re-check the LR on seeds 100-101 before the tier if
# training is unstable.
# Run: python 01_train.py +sweep=tier_longT --multirun
# Sweep order: seed first (MQAR only), then the rest.

experiment:
  phase: 2
  tier: tier_longT

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: range(0,10)
      task: mqar_longT
      model.gate_mode: kda,full
      model.layout: single,ws,ll
