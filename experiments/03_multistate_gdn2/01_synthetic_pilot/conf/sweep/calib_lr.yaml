# @package _global_
# Phase 1 calibration: LR selection.
# 6 core configs x 3 LRs x 2 selection seeds (100, 101) x 2 tasks = 72
# short runs. Per core config, pick the LR with the best validation
# accuracy on seeds 100-101; use it for seeds 0-9.
# Run: python 01_train.py +sweep=calib_lr --multirun

experiment:
  phase: 1
  tier: calib_lr

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: mqar,overwrite
      model.gate_mode: kda,full
      model.layout: single,ws,ll
      optimizer.lr: 0.001,0.003,0.01
      seed: range(100,102)
