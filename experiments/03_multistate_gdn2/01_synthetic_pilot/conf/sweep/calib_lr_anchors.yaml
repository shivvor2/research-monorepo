# Phase 1 calibration: anchor LR selection (protocol section 10, step 4).
# The anchors use gate gdn, which the main LR sweep never calibrates, so
# they get their own sweep: layouts {single, ll} x d_model {16, 32, 64}
# (the anchor override sets 1 head at d=16, 2 heads otherwise) x 3 LRs x
# selection seeds 100-101 = 36 short runs. Fill the chosen LRs into
# conf/frozen_protocol.yaml under anchor_lr (keyed by d_model, layout).
# Run: python 01_train.py +sweep=calib_lr_anchors --multirun

# @package _global_
experiment:
  phase: 1
  tier: calib_lr_anchors

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: mqar
      model.gate_mode: gdn
      model.layout: single,ll
      +anchor: tier6_d16,tier6_d32,tier6_d64
      optimizer.lr: 0.001,0.003,0.01
      seed: range(100,102)
