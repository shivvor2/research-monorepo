# @package _global_
# Phase 1 calibration: d_model selection (protocol §10 rule 2).
# single-state `full` on MQAR at d in {32, 64}, selection seeds 100-101.
# Pick the smallest d whose MQAR accuracy lands in [0.5, 0.95];
# fallback 32.
# Run: python 01_train.py +sweep=calib_dmodel --multirun

experiment:
  phase: 1
  tier: calib_dmodel

optimizer:
  lr: 0.003   # middle of {1e-3, 3e-3, 1e-2}; refined in calib_lr

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: mqar
      model.gate_mode: full
      model.layout: single
      model.d_model: 32,64
      seed: range(100,102)
