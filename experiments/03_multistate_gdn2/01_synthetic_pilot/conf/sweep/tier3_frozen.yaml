# @package _global_
# Tier 3 frozen control (predictions 2, 3): fs x gate {kda, full} x
# seeds 0-4, both tasks. 20 runs. Compare against the tier-1 ws rows.
# Run: python 01_train.py +sweep=tier3_frozen --multirun
# Sweep order: task (overwrite before mqar), then seed, then the rest.

experiment:
  phase: 2
  tier: tier3_frozen

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      task: overwrite,mqar
      seed: range(0,5)
      model.gate_mode: kda,full
      model.layout: fs
