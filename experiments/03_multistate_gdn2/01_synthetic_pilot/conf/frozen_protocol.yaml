# Frozen protocol (template).
#
# Filled in at the end of Phase 1 calibration, committed with
# frozen: true, and NOT revisited afterwards. 01_train.py refuses to run
# with experiment.phase >= 2 until frozen is true, and resolves
# optimizer.lr (when null) from lr_table[task][layout][gate_mode].

frozen: false

# d_model chosen in calibration from {32, 64}.
d_model: 32

# Harness switches chosen in calibration (rule 3): layer_pattern in
# {zoology, mixer_x2} and state_mixer in {none, mlp}.
harness:
  layer_pattern: zoology
  state_mixer: none

# Peak LR per (task, layout, gate_mode), selected on seeds 100-101
# from {1e-3, 3e-3, 1e-2}.
lr_table:
  mqar:
    single: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    ws: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    fs: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    ll: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
  overwrite:
    single: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    ws: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    fs: {full: null, b_only: null, w_only: null, kda: null, gdn: null}
    ll: {full: null, b_only: null, w_only: null, kda: null, gdn: null}

# Anchor LRs (tier 6), keyed by d_model, then layout. The anchors use gate
# gdn (never calibrated in lr_table) and get their own sweep,
# conf/sweep/calib_lr_anchors.yaml (36 short runs: layouts {single, ll} x
# d_model {16, 32, 64} x 3 LRs x seeds 100-101).
anchor_lr:
  16: {single: null, ll: null}
  32: {single: null, ll: null}
  64: {single: null, ll: null}

# The overwrite task file that goes with the chosen d_model: the largest K
# must equal 2 * d_k (d_k = d_model / num_heads when head_dim is unset),
# because the primary endpoint is defined there. 01_train.py enforces this
# and names the right file on a mismatch. The mapping is complete, so it
# needs no edit at the end of calibration.
overwrite_task_by_d_model:
  32: overwrite       # d_k = 16, K in {8, 16, 32}, T = 256
  64: overwrite_dk32  # d_k = 32, K in {16, 32, 64}, T = 512
