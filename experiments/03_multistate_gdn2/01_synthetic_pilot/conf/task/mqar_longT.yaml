# Long, sparse MQAR variant for the long-T tier (protocol §7):
# T = 2048, D in {8, 16, 32, 64}, uniform query gaps (power_a = 1) so
# most queries are hundreds of tokens after their key-value pair.
# t_max (ll slot count = 12) follows max_seq_len via config.yaml.

name: mqar
vocab_size: 8192
seq_len: 2048
num_kv_pairs: [8, 16, 32, 64]
power_a: 1.0
random_non_queries: true
max_seq_len: 2048
val_seed: 1000003
test_seed: 2000003
